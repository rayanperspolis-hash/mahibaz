<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3cae">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>ماهی‌باز | مدیریت فروش ماهی‌های تزیینی</title>
<style>
:root{--bg:#eef3fa;--card:#fff;--tx:#10244a;--mut:#6a7f9e;--pr:#1565d8;--pr2:#0b3a99;--or:#ff8a1f;--ok:#1f9d63;--bad:#d64545;--warn:#e0902b;--bd:#dce6f4;--sh:0 4px 18px rgba(12,50,120,.09)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1324;--card:#131f38;--tx:#e6eefc;--mut:#8ea3c4;--pr:#4d8dff;--bd:#25375c;--sh:0 4px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Vazirmatn,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;display:flex;min-height:100vh}
#side{width:250px;flex-shrink:0;background:linear-gradient(180deg,#07194d 0%,#0d3cae 60%,#1565d8 100%);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;overflow:hidden;z-index:20}
#side::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,138,31,.16);bottom:-70px;left:-70px;pointer-events:none}
.logo{text-align:center;padding:2px 0 14px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:12px}
.logo img{width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.logo small{display:block;opacity:.75;font-size:12px}
#side button.it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#d6e4ff;padding:11px 14px;border-radius:12px;cursor:pointer;font:inherit;margin-bottom:4px;transition:.2s;text-align:right}
#side button.it:hover{background:rgba(255,255,255,.12)}
#side button.it.on{background:#fff;color:var(--pr2);font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.2);border-right:4px solid var(--or)}
#side button.it span{font-size:19px}
.side-foot{margin-top:auto;font-size:12px;opacity:.8;text-align:center;position:relative}
#cont{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
.top h2{margin:0;font-size:18px;flex:1}
.top .dt{color:var(--mut);font-size:13px;background:var(--bg);padding:6px 12px;border-radius:20px}
#burger{display:none;border:0;background:var(--pr);color:#fff;border-radius:10px;font-size:20px;padding:4px 12px;cursor:pointer}
main{padding:20px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{border-radius:16px;padding:16px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh)}
.stat::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14);left:-20px;bottom:-30px}
.stat .ic{font-size:26px}.stat small{display:block;opacity:.92;margin-top:6px}.stat b{display:block;font-size:19px;margin-top:3px}
.c1{background:linear-gradient(135deg,#1565d8,#4d9bff)}.c2{background:linear-gradient(135deg,#1f9d63,#36c98a)}.c3{background:linear-gradient(135deg,#6a4cf0,#9b86ff)}.c4{background:linear-gradient(135deg,#ff8a1f,#ffb25c)}.c5{background:linear-gradient(135deg,#d64545,#f07a7a)}.c6{background:linear-gradient(135deg,#0b3a99,#2f6fd0)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:16px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--pr);border-color:transparent}
.btn{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font:inherit}
.btn.or{background:linear-gradient(135deg,#ff8a1f,#ff6a00)}
.btn.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.btn.d{background:var(--bad)}
.btn.s{padding:4px 10px;font-size:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{color:var(--mut);font-size:12px;background:var(--bg)}
tr:hover td{background:rgba(21,101,216,.05)}
.tag{padding:3px 10px;border-radius:12px;font-size:12px;color:#fff}
.low{background:var(--bad)}.okk{background:var(--ok)}.wr{background:var(--warn)}.nr{background:#1565d8}.md{background:#e0559b}
.empty{color:var(--mut);text-align:center;padding:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row input{max-width:280px}
.jd{display:grid;grid-template-columns:.8fr 1.3fr 1fr;gap:4px}.jd select{padding:9px 4px}
.chart{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.bar i{display:block;width:100%;max-width:46px;background:linear-gradient(180deg,#ff8a1f,#1565d8);border-radius:8px 8px 0 0;min-height:3px}
.bar em{font-style:normal;margin-bottom:4px;color:var(--tx)}
.th{width:44px;height:44px;border-radius:10px;object-fit:cover;display:block;background:var(--bg);cursor:zoom-in}
.thp{width:44px;height:44px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px}
.pv{width:90px;height:90px;border-radius:12px;object-fit:cover;border:1px dashed var(--bd)}
.irow{display:grid;grid-template-columns:2fr .7fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
.tot{font-size:17px;font-weight:700;color:var(--pr)}
#ov{display:none;position:fixed;inset:0;background:rgba(5,15,40,.65);z-index:100;overflow:auto;padding:20px}
#ov.on{display:block}
.sheet{background:#fff;color:#111;max-width:760px;margin:0 auto;border-radius:14px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.sheet table{min-width:0}.sheet th{background:#f1f5fb;color:#334}.sheet td,.sheet th{border-bottom:1px solid #dde4ef;color:#111}
.sheet tr:hover td{background:none}
.ih{display:flex;align-items:center;gap:16px;border-bottom:3px solid #1565d8;padding-bottom:12px;margin-bottom:14px}
.ih img{width:96px;height:96px;object-fit:contain}.ih h1{margin:0;font-size:22px;color:#0b3a99}.ih .m{font-size:13px;color:#555}
.ib{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;background:#f1f5fb;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.sum{margin-right:auto;max-width:300px;margin-top:12px}.sum div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #ccd}
.sum .g{font-weight:700;font-size:17px;color:#0b3a99;border-bottom:2px solid #0b3a99}
.sig{display:flex;justify-content:space-around;margin-top:40px;font-size:13px;color:#555}
.sig span{border-top:1px solid #999;padding-top:6px;min-width:140px;text-align:center}
.fn{text-align:center;color:#888;font-size:12px;margin-top:20px}
.hp details{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:8px}.hp summary{cursor:pointer;font-weight:700}.hp ol,.hp ul{line-height:2;margin:8px 0 2px;padding-right:22px}.hp p{line-height:1.9;margin:8px 0}.hp .tip{background:rgba(255,138,31,.12);border-right:4px solid var(--or);padding:8px 12px;border-radius:8px;margin:8px 0}
.ibt{flex-wrap:wrap;max-width:760px;margin:0 auto 12px;display:flex;gap:8px}
#bb{display:none}
#inst{display:none;border:0;background:var(--or);color:#fff;border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
@media(max-width:820px){
 #side{position:fixed;right:0;top:0;transform:translateX(100%);transition:.3s;padding-top:calc(16px + env(safe-area-inset-top))}
 #side.open{transform:none;box-shadow:-8px 0 30px rgba(0,0,0,.4)}#burger{display:none}.top .dt{display:none}
 .top{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}.top h2{font-size:17px}
 main{padding:12px;padding-bottom:96px}
 .irow{grid-template-columns:1fr 1fr}.sheet{padding:14px}
 input,select{font-size:16px;padding:11px}.btn{padding:12px 16px}.btn.s{padding:7px 12px}
 .grid{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px}.stat b{font-size:16px}
 #bb{display:flex;position:fixed;bottom:0;right:0;left:0;background:var(--card);border-top:1px solid var(--bd);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.12)}
 #bb button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:10px}
 #bb button span{font-size:22px;transition:.2s}
 #bb button.on{color:var(--pr);font-weight:700}#bb button.on span{transform:translateY(-3px)}
}
@media print{body>*:not(#ov){display:none!important}#ov{position:static;background:none;padding:0;display:block!important}.ibt{display:none}.sheet{box-shadow:none;border-radius:0;max-width:none;padding:0}@page{margin:12mm}}
</style>
</head>

 <main id="app"></main>
</div>

 <ul><li><b>جنسیت:</b> نر، ماده، جفت یا نامشخص. اگر از یک نوع هم نر دارید هم ماده، دو ردیف جدا بسازید تا موجودی هر کدام جدا بماند.</li><li><b>عکس:</b> هنگام افزودن یا ویرایش، عکس را انتخاب کنید. روی عکس کوچک در جدول بزنید تا بزرگ شود.</li><li><b>عدد قرمز:</b> یعنی موجودی کم است و باید تأمین کنید. حد هشدار را در داشبورد می‌توانید عوض کنید.</li></ul>`)}
 ${d('📥 خرید و تولید',`<p>هر وقت ماهی خریدید یا بچه‌ماهی‌هایتان بزرگ شد و آماده‌ی فروش شد، اینجا بنویسید. تاریخ، نوع ماهی، تعداد و قیمت هر عدد را وارد کنید. برنامه از روی خریدها «میانگین قیمت خرید» را حساب می‌کند و برای محاسبه‌ی سود استفاده می‌کند. برای ماهی‌های خودتان قیمت تمام‌شده‌ی تقریبی را بنویسید.</p>`)}
 ${d('🧾 فاکتور فروش و گرفتن عکس از آن',`<ol><li>تاریخ را انتخاب کنید و در صورت نیاز مشتری را بزنید.</li><li>ماهی را انتخاب کنید. قیمت فروش خودکار می‌آید و می‌توانید تغییرش دهید. تعداد را بنویسید.</li><li>اگر چند نوع ماهی خرید، «افزودن ردیف ماهی» را بزنید.</li><li>تخفیف و مبلغی که مشتری پرداخت کرده را بنویسید. اگر خالی بگذارید یعنی کامل پرداخت کرده.</li><li>«ثبت و نمایش فاکتور» را بزنید. فاکتور باز می‌شود.</li></ol>
 <p>روی صفحه‌ی فاکتور سه دکمه هست:</p><ul><li><b>📷 ذخیره به عکس:</b> فاکتور را به‌صورت عکس PNG در گوشی یا کامپیوتر ذخیره می‌کند تا در واتساپ یا تلگرام برای مشتری بفرستید.</li><li><b>🖨️ چاپ / PDF:</b> برای چاپ روی کاغذ، یا در پنجره‌ی چاپ گزینه‌ی «Save as PDF» را بزنید.</li><li><b>بستن:</b> برگشت به برنامه.</li></ul>
 <div class="tip">فاکتورهای قدیمی در پایین همین صفحه هستند. دکمه‌ی «فاکتور» کنار هر کدام را بزنید تا دوباره باز شود.</div>`)}
 ${d('⏳ مشتری که پول را کامل نداده',`<p>در فاکتور فقط مبلغی را که گرفته‌اید بنویسید. باقی‌مانده به‌عنوان «طلب» می‌ماند و در داشبورد و صفحه‌ی مشتریان دیده می‌شود. هر وقت پول را داد، در لیست فاکتورها دکمه‌ی «تسویه» را بزنید و مبلغ را بنویسید.</p>`)}
 ${d('💸 هزینه‌ها',`<p>خرج‌های دیگر مثل غذا، دارو، برق، آب، فیلتر و اجاره را اینجا بنویسید. این‌ها از سود کم می‌شوند و «سود خالص» واقعی را نشان می‌دهند.</p>`)}
 ${d('📊 داشبورد یعنی چه؟',`<ul><li><b>فروش کل:</b> جمع همه‌ی فاکتورها.</li><li><b>سود ناخالص:</b> فروش منهای قیمت خرید ماهی‌های فروخته‌شده.</li><li><b>سود خالص:</b> سود ناخالص منهای هزینه‌ها.</li><li><b>ارزش موجودی:</b> ماهی‌های داخل حوض‌ها به قیمت خرید.</li><li><b>طلب از مشتریان:</b> پولی که هنوز نگرفته‌اید.</li></ul>`)}
 ${d('💾 پشتیبان‌گیری (خیلی مهم)',`<p>اطلاعات فقط روی همین مرورگر و همین دستگاه ذخیره می‌شود. اگر مرورگر پاک شود یا دستگاه عوض شود، اطلاعات از بین می‌رود.</p><div class="tip">هفته‌ای یک بار در «تنظیمات و پشتیبان» دکمه‌ی «دانلود پشتیبان» را بزنید و فایل را جای امن (مثلاً تلگرام یا فلش) نگه دارید. برای انتقال به دستگاه دیگر، همان فایل را با «بازیابی» وارد کنید.</div>`)}
 ${d('❓ سؤال‌های رایج',`<ul><li><b>فاکتور را اشتباه زدم؟</b> در لیست فاکتورها «حذف» را بزنید و دوباره بزنید. موجودی خودکار برمی‌گردد.</li><li><b>ماهی را اشتباه ثبت کردم؟</b> در «موجودی ماهی» دکمه‌ی «ویرایش» را بزنید.</li><li><b>تاریخ‌ها میلادی هستند؟</b> نه، همه‌جا شمسی است.</li><li><b>بدون اینترنت کار می‌کند؟</b> بله، کاملاً.</li><li><b>روی گوشی هم کار می‌کند؟</b> بله؛ منو با دکمه‌ی ☰ بالای صفحه باز می‌شود.</li></ul>`)}
 </div>`},
data(){const s=D.set.shop;
 return`<div class="card"><h3>🏪 مشخصات فروشگاه (روی فاکتور چاپ می‌شود)</h3><div class="fm">
 <div><label>نام</label><input value="${esc(s.name)}" onchange="D.set.shop.name=this.value;save();render()"></div>
 <div><label>تلفن</label><input value="${esc(s.phone)}" onchange="D.set.shop.phone=this.value;save()"></div>
 <div><label>آدرس</label><input value="${esc(s.addr)}" onchange="D.set.shop.addr=this.value;save()"></div>
 <div><label>شماره فاکتور بعدی</label><input type="number" value="${D.set.nextNo}" onchange="D.set.nextNo=+this.value;save()"></div></div></div>
 <div class="card"><h3>💾 پشتیبان‌گیری و خروجی</h3><p style="color:var(--mut)">اطلاعات روی همین مرورگر ذخیره می‌شود. هر چند وقت یک‌بار پشتیبان بگیرید تا با پاک شدن مرورگر از بین نرود (عکس‌ها هم در پشتیبان هستند).</p>
 <div class="row"><button class="btn" onclick="exp_()">⬇️ دانلود پشتیبان</button><label class="btn g" style="margin:0;cursor:pointer;color:var(--pr)">⬆️ بازیابی<input type="file" accept=".json" hidden onchange="imp(this)"></label><button class="btn g" onclick="csv()">📄 خروجی فروش (CSV)</button><button class="btn d" onclick="if(confirm('همه اطلاعات پاک شود؟')){localStorage.removeItem(KEY);location.reload()}">حذف همه</button></div></div>`}
};
/* actions */
function saveFish(e){e.preventDefault();const o=fd(e.target);const r={name:o.name,kind:o.kind,sex:o.sex,init:+o.init,cost:+o.cost,sell:+o.sell,place:o.place,img:fimg};if(fe)Object.assign(fobj(fe),r);else D.fish.push(Object.assign({id:uid()},r));fe=null;fimg='';save();render()}
function addBuy(e){e.preventDefault();const o=fd(e.target);D.buys.push({id:uid(),date:o.date,fish:o.fish,qty:+o.qty,price:+o.price,src:o.src});save();render()}
function dItem(i,k,v){dr.items[i][k]=v;if(k=='fish'){dr.items[i].price=fobj(v).sell||0}render()}
function updT(){const t=document.getElementById('dtot');if(t)t.textContent=money(sub(dr)-(+dr.discount||0))}
function addInv(){const items=dr.items.filter(i=>i.fish&&i.qty>0);if(!items.length){alert('حداقل یک ماهی انتخاب کنید');return}
 for(const i of items){if(i.qty>stock(i.fish)&&!confirm('تعداد «'+fishName(i.fish)+'» بیشتر از موجودی است. ادامه می‌دهید؟'))return}
 const v={id:uid(),no:D.set.nextNo++,date:dr.date,cust:dr.cust,items:items.map(i=>({fish:i.fish,qty:+i.qty,price:+i.price})),discount:+dr.discount||0,paid:0,note:dr.note};
 v.paid=dr.paid===''?invT(v):Math.min(+dr.paid,invT(v));D.inv.push(v);dr={date:today(),cust:'',items:[{fish:'',qty:1,price:0}],discount:'',paid:'',note:''};save();render();showInv(v.id)}
function pay(id){const v=D.inv.find(s=>s.id==id);const r=invT(v)-v.paid;const x=prompt('مبلغ دریافتی (مانده: '+r+' تومان)',r);if(x){v.paid=Math.min(invT(v),v.paid+ +x);save();render()}}
function addCust(e){e.preventDefault();D.cust.push(Object.assign({id:uid()},fd(e.target)));save();render()}
function addExp(e){e.preventDefault();const o=fd(e.target);D.exp.push({id:uid(),date:o.date,cat:o.cat,amount:+o.amount,note:o.note});save();render()}
function del(k,id){if(confirm('حذف شود؟')){D[k]=D[k].filter(x=>x.id!=id);save();render()}}
let curInv=0;function showInv(id){const v=D.inv.find(s=>s.id==id);curInv=v.no;const c=custObj(v.cust),s=D.set.shop,t=invT(v),dsc=+v.discount||0;
 document.getElementById('ov').innerHTML=`<div class="ibt"><button class="btn or" onclick="shot()">📷 ذخیره به عکس</button><button class="btn" onclick="window.print()">🖨️ چاپ / PDF</button><button class="btn g" style="background:#fff" onclick="closeInv()">بستن</button></div>
 <div class="sheet"><div class="ih"><img src="${LOGO}"><div style="flex:1"><h1>${esc(s.name)}</h1><div class="m">فروش و پرورش ماهی‌های تزیینی${s.phone?' · تلفن: '+esc(s.phone):''}${s.addr?'<br>'+esc(s.addr):''}</div></div><div style="text-align:left"><b style="font-size:18px">فاکتور فروش</b><div class="m">شماره: ${fnum(v.no)}</div><div class="m">تاریخ: ${jd(v.date)}</div></div></div>
 <div class="ib"><span>خریدار: <b>${esc(custName(v.cust))}</b></span>${c.phone?`<span>تلفن: ${esc(c.phone)}</span>`:''}${c.addr?`<span>نشانی: ${esc(c.addr)}</span>`:''}</div>
 <table><tr><th>#</th><th>شرح (ماهی)</th><th>جنسیت</th><th>تعداد</th><th>قیمت واحد</th><th>جمع</th></tr>${v.items.map((i,n)=>`<tr><td>${fnum(n+1)}</td><td>${esc(fishName(i.fish))}</td><td>${(SEX[fobj(i.fish).sex]||['—'])[0]}</td><td>${fa(i.qty)}</td><td>${fa(i.price)}</td><td>${fa(i.qty*i.price)}</td></tr>`).join('')}</table>
 <div class="sum"><div><span>جمع کل</span><span>${money(sub(v))}</span></div>${dsc?`<div><span>تخفیف</span><span>${money(dsc)}</span></div>`:''}<div class="g"><span>مبلغ قابل پرداخت</span><span>${money(t)}</span></div><div><span>پرداخت‌شده</span><span>${money(v.paid)}</span></div><div><span>مانده</span><span>${money(t-v.paid)}</span></div></div>
 ${v.note?`<p style="font-size:13px">توضیحات: ${esc(v.note)}</p>`:''}
 <div class="sig"><span>امضای فروشنده</span><span>امضای خریدار</span></div><div class="fn">از خرید شما سپاسگزاریم 🐠 — ${esc(s.name)}</div></div>`;
 document.getElementById('ov').classList.add('on')}
function shot(){const el=document.querySelector('#ov .sheet');const w=el.offsetWidth,h=el.offsetHeight;
 try{let css='';[...document.styleSheets[0].cssRules].forEach(r=>{if(r.type===1)css+=r.cssText+'\n'});
 const c=el.cloneNode(true);c.style.cssText='width:'+w+'px;max-width:none;margin:0;box-shadow:none;border-radius:0';
 const x=new XMLSerializer().serializeToString(c);
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w*2+'" height="'+h*2+'" viewBox="0 0 '+w+' '+h+'"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font-family:Tahoma,sans-serif;font-size:15px;color:#111"><style><![CDATA['+css+']]></style>'+x+'</div></foreignObject></svg>';
 const im=new Image();
 im.onload=()=>{try{const cv=document.createElement('canvas');cv.width=w*2;cv.height=h*2;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0);cv.toBlob(b=>{if(!b){alert('ساخت عکس ممکن نشد. از دکمه‌ی چاپ / PDF استفاده کنید.');return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='factor-'+curInv+'.png';a.click()},'image/png')}catch(e){alert('مرورگر اجازه‌ی ساخت عکس نداد. از دکمه‌ی چاپ / PDF استفاده کنید.')}};
 im.onerror=()=>alert('ساخت عکس ممکن نشد. از دکمه‌ی چاپ / PDF استفاده کنید.');
 im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}catch(e){alert('ساخت عکس ممکن نشد. از دکمه‌ی چاپ / PDF استفاده کنید.')}}
function closeInv(){document.getElementById('ov').classList.remove('on')}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function exp_(){dl('mahibaz-backup-'+jdn(today()).replace(/\//g,'-')+'.json',JSON.stringify(D),'application/json')}
function imp(i){const r=new FileReader();r.onload=()=>{try{D=Object.assign({fish:[],buys:[],inv:[],cust:[],exp:[],set:{}},JSON.parse(r.result));D.set=Object.assign({low:5,nextNo:1001,shop:{name:'ماهی‌باز',phone:'',addr:''}},D.set);save();render();alert('بازیابی شد')}catch(e){alert('فایل نامعتبر است')}};r.readAsText(i.files[0])}
function csv(){const rows=[['شماره فاکتور','تاریخ شمسی','مشتری','ماهی','تعداد','قیمت','جمع']];D.inv.forEach(v=>v.items.forEach(i=>rows.push([v.no,jdn(v.date),custName(v.cust),fishName(i.fish),i.qty,i.price,i.qty*i.price])));dl('sales.csv','\ufeff'+rows.map(r=>r.join(',')).join('\n'),'text/csv')}
render();
document.getElementById('cont').addEventListener('click',()=>document.getElementById('side').classList.remove('open'));
let ip=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;document.getElementById('inst').style.display='inline-block'});
function doInstall(){if(ip){ip.prompt();ip=null;document.getElementById('inst').style.display='none'}}
window.addEventListener('appinstalled',()=>{document.getElementById('inst').style.display='none'});
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
